<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digital Delivery Service</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="player">
    <div class="left">
      <div class="cover"></div>
      <div class="meta">
        <div class="title">Canción de Ejemplo</div>
        <div class="artist">Artista Demo</div>
      </div>
    </div>
    <div class="center">
      <button id="playBtn">▶</button>
      <div class="bar">
        <div id="progress" class="progress"></div>
      </div>
    </div>
    <div class="right">
      <button id="deliverBtn">Deliver</button>
    </div>
  </div>

  <div class="log">
    <h3>Logs</h3>
    <ul id="logs"></ul>
  </div>

  <script src="/app.js"></script>
</body>
</html>
