---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lyrics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lyrics-service
  template:
    metadata:
      labels:
        app: lyrics-service
    spec:
      containers:
        - name: lyrics-service
          image: lyrics-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: lyrics-service
spec:
  selector:
    app: lyrics-service
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
